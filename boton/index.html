<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2A0614">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El bote de Olga</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="El bote">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,wght@0,600;0,700;1,500;1,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #24050F;
    --wine: #3A0A1C;
    --burg: #5E1230;
    --burg-2: #7C1C42;
    --rose: #C2306B;
    --pink: #EE6FA5;
    --pink-2: #F7A9C9;
    --blush: #FFD6E6;
    --green: #2E5A1B;
    --green-2: #4F8226;
    --lime: #A6CC45;
    --mint: #D9EBA8;
    --cream: #FFF4EC;
    --ink: #3A0A1C;
    --ink-2: rgba(58, 10, 28, .6);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --display: 'Fraunces', Georgia, serif;
    --ui: 'Nunito', system-ui, sans-serif;
    --hand: 'Caveat', cursive;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--ui); color: var(--cream); background: var(--night); touch-action: manipulation; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  /* ================= fondo ================= */
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(90% 55% at 50% -5%, rgba(238, 111, 165, .45), transparent 70%),
      radial-gradient(80% 45% at 10% 105%, rgba(79, 130, 38, .55), transparent 70%),
      radial-gradient(70% 40% at 100% 90%, rgba(194, 48, 107, .35), transparent 70%),
      linear-gradient(180deg, var(--burg) 0%, var(--wine) 45%, var(--night) 100%); }
  .sky::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255, 214, 230, .14) 1.2px, transparent 1.4px); background-size: 26px 26px; }
  .twinkle { position: absolute; color: var(--pink-2); font-size: 10px; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .15; transform: scale(.5) rotate(40deg); } }
  .grain { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: .18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* ================= estructura ================= */
  .app { position: fixed; inset: 0; z-index: 2; opacity: 0; pointer-events: none; transition: opacity .8s; }
  .app.on { opacity: 1; pointer-events: auto; }
  .screen { position: absolute; inset: 0; padding: calc(18px + var(--safe-t)) 18px calc(104px + var(--safe-b));
    transition: opacity .4s, transform .4s; }
  .screen.off { opacity: 0; transform: translateY(16px); pointer-events: none; }

  /* ================= pantalla del bote ================= */
  #jarScreen { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .title { font-family: var(--display); font-style: italic; font-weight: 600; font-size: clamp(34px, 9.5vw, 44px); line-height: 1; color: var(--blush); margin-top: 8px; }
  .title b { font-style: normal; color: var(--pink); }
  .sub { margin-top: 8px; font-size: 14px; font-weight: 700; color: rgba(255, 214, 230, .72); }
  .sub b { color: var(--lime); }
  .jar-area { position: relative; flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }
  .tap-hint { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-family: var(--hand); font-size: 26px; color: var(--pink-2); white-space: nowrap;
    animation: nudge 1.6s ease-in-out infinite; pointer-events: none; transition: opacity .4s; }
  @keyframes nudge { 50% { transform: translate(-50%, -6px); } }
  .finger { position: absolute; font-size: 34px; pointer-events: none; animation: tapf 1.4s ease-in-out infinite; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); transition: opacity .4s; }
  @keyframes tapf { 0%, 100% { transform: translate(0, 0) scale(1); } 45% { transform: translate(-6px, -10px) scale(.88); } }

  /* ---------- el bote ---------- */
  .jar { position: relative; width: 236px; height: 310px; cursor: pointer; touch-action: manipulation; transform-origin: 50% 90%; }
  .jar.idle { animation: idle 4s ease-in-out infinite; }
  @keyframes idle { 0%, 84%, 100% { transform: none; } 88% { transform: rotate(-3deg); } 92% { transform: rotate(3deg); } 96% { transform: rotate(-1.5deg); } }
  .jar.shake { animation: shake .6s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes shake { 15% { transform: rotate(-8deg) scale(1.03, .97); } 35% { transform: rotate(7deg) scale(.98, 1.04); } 55% { transform: rotate(-4deg); } 75% { transform: rotate(2deg); } }
  .jar:active { transform: scale(.97); }
  .jar-glow { position: absolute; left: 50%; bottom: -8px; width: 260px; height: 60px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(238, 111, 165, .55), transparent); filter: blur(6px); z-index: 0; }
  .lid-wrap { position: absolute; left: 50%; top: 14px; width: 156px; transform: translateX(-50%); z-index: 5; transition: transform .25s; }
  .jar.pop .lid-wrap { animation: lid .7s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes lid { 30% { transform: translate(-50%, -30px) rotate(-14deg); } 70% { transform: translate(-50%, -6px) rotate(4deg); } }
  .lid { height: 36px; border-radius: 12px 12px 9px 9px;
    background: linear-gradient(180deg, #9A2C55, var(--burg) 70%, #4A0D24);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .18), inset 0 -5px 0 rgba(0, 0, 0, .2), 0 5px 10px rgba(0, 0, 0, .35); position: relative; }
  .lid::before { content: ""; position: absolute; left: 10px; right: 10px; top: 9px; bottom: 9px; border-radius: 3px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .1) 0 3px, transparent 3px 9px); }
  .bow { position: absolute; left: 50%; top: -22px; width: 74px; transform: translateX(-50%); filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .3)); }
  .neck { position: absolute; left: 50%; top: 46px; width: 146px; height: 18px; transform: translateX(-50%); border-radius: 7px; z-index: 3;
    background: rgba(255, 230, 240, .22); border: 2.5px solid rgba(255, 214, 230, .45); }
  .glass { position: absolute; left: 10px; right: 10px; top: 58px; bottom: 0; z-index: 2; border-radius: 40px 40px 52px 52px; overflow: hidden;
    background: linear-gradient(105deg, rgba(255, 230, 240, .26), rgba(255, 230, 240, .08) 45%, rgba(255, 230, 240, .18));
    border: 2.5px solid rgba(255, 214, 230, .5);
    box-shadow: inset 0 -16px 40px rgba(238, 111, 165, .25), inset 0 10px 22px rgba(255, 255, 255, .1), 0 22px 40px -14px rgba(0, 0, 0, .6);
  }
  .shine { position: absolute; z-index: 4; border-radius: 20px; background: rgba(255, 255, 255, .55); pointer-events: none; }
  .shine.a { left: 26px; top: 84px; width: 13px; height: 150px; }
  .shine.b { left: 46px; top: 96px; width: 6px; height: 54px; opacity: .6; }
  .shine.c { right: 26px; top: 120px; width: 6px; height: 90px; opacity: .25; }
  .slip { position: absolute; width: 40px; height: 24px; border-radius: 4px; box-shadow: 0 2px 0 rgba(58, 10, 28, .25); transition: transform .5s cubic-bezier(.3, 1.4, .5, 1), opacity .3s; }
  .slip::after { content: ""; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 1.5px; background: rgba(58, 10, 28, .14); }
  .slip.gone { opacity: 0; transform: translateY(-160px) scale(.5) !important; }
  .tag { position: absolute; right: -6px; top: 64px; z-index: 6; transform-origin: 10px 0; animation: sway 3.4s ease-in-out infinite; pointer-events: none; }
  @keyframes sway { 50% { transform: rotate(6deg); } }
  .tag .string { position: absolute; left: 8px; top: -14px; width: 2px; height: 22px; background: var(--lime); transform: rotate(-30deg); }
  .tag .card { margin-top: 6px; padding: 6px 12px 4px 16px; border-radius: 4px 10px 10px 4px; background: var(--lime); color: var(--green);
    font-family: var(--hand); font-weight: 700; font-size: 22px; line-height: 1; transform: rotate(14deg); box-shadow: 0 4px 10px rgba(0, 0, 0, .3); position: relative; }
  .tag .card::before { content: ""; position: absolute; left: 5px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--wine); }
  .jar .label { position: absolute; left: 50%; bottom: 46px; z-index: 5; transform: translateX(-50%) rotate(-3deg); pointer-events: none;
    padding: 8px 18px 6px; border-radius: 10px; background: var(--cream); color: var(--burg); box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
    font-family: var(--display); font-style: italic; font-weight: 600; font-size: 20px; white-space: nowrap; }
  .jar .label small { display: block; font-family: var(--ui); font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--rose); margin-bottom: 1px; }

  /* ================= conejito ================= */
  .bunny { position: fixed; z-index: 30; left: 50%; bottom: 24%; width: 210px; transform: translateX(-50%);
    transition: left .9s cubic-bezier(.5, 0, .3, 1), bottom .9s cubic-bezier(.5, 0, .3, 1), width .9s cubic-bezier(.5, 0, .3, 1), transform .9s cubic-bezier(.5, 0, .3, 1), opacity .4s; cursor: pointer; }
  .bunny svg { width: 100%; display: block; overflow: visible; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .45)); }
  .bunny.enter svg { animation: hopIn 2.1s cubic-bezier(.4, 0, .4, 1) both; }
  @keyframes hopIn {
    0% { transform: translateX(170%) translateY(0); } 12% { transform: translateX(130%) translateY(-34px); } 24% { transform: translateX(95%) translateY(0) scale(1.04, .94); }
    36% { transform: translateX(62%) translateY(-34px); } 48% { transform: translateX(32%) translateY(0) scale(1.04, .94); } 62% { transform: translateX(8%) translateY(-28px); }
    78% { transform: translateX(0) translateY(0) scale(1.06, .92); } 88% { transform: translateY(-6px); } 100% { transform: none; } }
  .bunny.corner { left: 4px; bottom: calc(80px + var(--safe-b)); width: 96px; transform: none; }
  .bunny.hidden { opacity: 0; pointer-events: none; }
  .bunny.hop svg { animation: hop .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes hop { 0% { transform: scale(1.06, .9); } 40% { transform: translateY(-26px) scale(.96, 1.05); } 75% { transform: scale(1.05, .93); } }
  .ear { transform-box: fill-box; transform-origin: 50% 100%; }
  .ear-l { animation: earL 4.5s ease-in-out infinite; }
  .ear-r { animation: earR 4.5s ease-in-out infinite; }
  @keyframes earL { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-12deg); } 84% { transform: rotate(4deg); } }
  @keyframes earR { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(14deg); } 92% { transform: rotate(-4deg); } }
  .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .bunny.happy .eyes { display: none; }
  .bunny .happy-eyes { display: none; }
  .bunny.happy .happy-eyes { display: inline; }
  .held { transition: opacity .3s, transform .5s; }
  .bunny.give .held { transform: translateY(-14px); }
  .bunny.gave .held { opacity: 0; }
  .bunny.gave .paws-hold { display: none; }
  .bunny .paws-rest { display: none; }
  .bunny.gave .paws-rest { display: inline; }

  .bubble { position: absolute; left: 50%; bottom: 100%; margin-bottom: 4px; transform: translateX(-50%) scale(.6); opacity: 0; transform-origin: 50% 100%;
    width: max-content; max-width: min(300px, 82vw); padding: 12px 16px; border-radius: 20px; background: var(--cream); color: var(--ink);
    font-weight: 800; font-size: 16px; line-height: 1.3; text-align: center; box-shadow: 0 12px 26px -8px rgba(0, 0, 0, .5);
    transition: opacity .3s, transform .4s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; }
  .bubble::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -9px; border: 9px solid transparent; border-top-color: var(--cream); }
  .bubble.on { opacity: 1; transform: translateX(-50%) scale(1); }
  .bubble em { font-style: normal; color: var(--rose); }
  .bunny.corner .bubble { left: 18px; transform: translateX(0) scale(.6); transform-origin: 0 100%; font-size: 14px; padding: 9px 13px; max-width: 220px; }
  .bunny.corner .bubble.on { transform: translateX(0) scale(1); }
  .bunny.corner .bubble::after { left: 34px; }

  /* ================= intro ================= */
  .intro { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 22px calc(30px + var(--safe-b)); transition: opacity .6s; }
  .intro.off { opacity: 0; pointer-events: none; }
  .intro .top { position: absolute; top: calc(48px + var(--safe-t)); left: 0; right: 0; text-align: center; padding: 0 20px; }
  .intro .top .k { font-size: 12px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--pink-2); opacity: .8; }
  .intro .top h1 { font-family: var(--display); font-style: italic; font-weight: 600; font-size: clamp(40px, 11vw, 54px); line-height: 1; color: var(--blush); margin-top: 10px; }
  .intro .top h1 b { font-style: normal; color: var(--pink); }
  .intro-btn { height: 58px; padding: 0 30px; border-radius: 999px; background: var(--pink); color: var(--wine); font-weight: 800; font-size: 17px;
    box-shadow: 0 14px 30px -10px rgba(238, 111, 165, .7), inset 0 -4px 0 rgba(0, 0, 0, .12); transition: transform .15s, opacity .4s; }
  .intro-btn:active { transform: scale(.95); }
  .intro-btn.ghost { background: transparent; color: var(--pink-2); box-shadow: none; height: 44px; font-size: 14px; }
  .intro .skip { opacity: 0; }

  /* ================= navegación ================= */
  .nav { position: fixed; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translateX(-50%); z-index: 20;
    display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(36, 5, 15, .72);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(255, 214, 230, .14); box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .6); }
  .nav button { position: relative; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: 999px;
    font-weight: 800; font-size: 15px; color: rgba(255, 214, 230, .7); transition: background .3s, color .3s; }
  .nav button .i { font-size: 20px; transition: transform .35s cubic-bezier(.3, 1.8, .5, 1); }
  .nav button.on { background: var(--pink); color: var(--wine); }
  .nav button.on .i { transform: scale(1.15) rotate(-8deg); }
  .badge { position: absolute; top: 2px; right: 6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--lime); color: var(--green);
    font-size: 11px; font-weight: 800; line-height: 20px; text-align: center; font-style: normal; }
  .badge:empty { display: none; }
  .badge.bump { animation: bump .55s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes bump { 40% { transform: scale(1.6); } }

  /* ================= tablero ================= */
  #boardScreen { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .b-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 2px 14px; }
  .b-head h2 { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 38px; line-height: 1; color: var(--blush); }
  .b-head h2 b { font-style: normal; color: var(--lime); }
  .b-head span { font-family: var(--hand); font-size: 20px; color: var(--pink-2); white-space: nowrap; }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(255, 214, 230, .08); border: 1px solid rgba(255, 214, 230, .14); margin-bottom: 20px; }
  .seg button { height: 38px; padding: 0 16px; border-radius: 999px; font-weight: 800; font-size: 14px; color: rgba(255, 214, 230, .72); transition: all .25s; }
  .seg button.on { background: var(--cream); color: var(--burg); }
  .board { columns: 2; column-gap: 14px; }
  .pin { break-inside: avoid; display: block; width: 100%; margin-bottom: 18px; padding: 22px 13px 12px; border-radius: 4px; text-align: left; position: relative;
    background: var(--paper); color: var(--ink); box-shadow: 0 10px 18px -10px rgba(0, 0, 0, .6); transform: rotate(var(--rot));
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .pin:active { transform: rotate(0) scale(.96); }
  .pin.new { animation: pinIn .7s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pinIn { from { transform: translateY(-40px) scale(.6) rotate(-12deg); opacity: 0; } }
  .pin::before { content: ""; position: absolute; top: -6px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), var(--pc); box-shadow: 0 3px 4px rgba(0, 0, 0, .35); }
  .pin p { font-family: var(--hand); font-weight: 600; font-size: 21px; line-height: 1.05; }
  .pin .f { position: absolute; right: 7px; bottom: 4px; font-size: 13px; }
  .empty { text-align: center; padding: 50px 20px; color: rgba(255, 214, 230, .75); font-weight: 700; font-size: 15px; line-height: 1.5; column-span: all; }
  .empty div { font-size: 54px; margin-bottom: 10px; }

  /* ================= notita abierta ================= */
  .modal { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b));
    background: rgba(36, 5, 15, .62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .modal.on { opacity: 1; pointer-events: auto; }
  .note { position: relative; width: min(380px, 100%); min-height: 290px; padding: 54px 26px 30px; border-radius: 6px; background: var(--paper); color: var(--ink);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7); display: flex; flex-direction: column; justify-content: center; touch-action: none; transform: rotate(var(--r, -1deg));
    background-image: repeating-linear-gradient(transparent 0 37px, rgba(94, 18, 48, .09) 37px 38px); background-position: 0 24px; }
  .note.unfold { animation: unfold .9s cubic-bezier(.2, 1.1, .35, 1) both; transform-origin: 50% 0; }
  @keyframes unfold { 0% { transform: perspective(900px) rotateX(-96deg) scale(.45) translateY(-30px); opacity: 0; } 40% { opacity: 1; }
    72% { transform: perspective(900px) rotateX(10deg) scale(1.02); } 100% { transform: perspective(900px) rotateX(0) rotate(var(--r, -1deg)); } }
  .note .washi { position: absolute; top: -12px; left: 50%; width: 110px; height: 28px; transform: translateX(-50%) rotate(-3deg); background: var(--tc); opacity: .85;
    background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .25) 0 5px, transparent 5px 10px); }
  .note .new-tag { position: absolute; top: 18px; right: 20px; font-family: var(--hand); font-size: 22px; font-weight: 700; color: var(--rose); transform: rotate(6deg); }
  .note p { font-family: var(--hand); font-weight: 600; font-size: clamp(30px, 8.4vw, 38px); line-height: 1.05; text-align: center; text-wrap: balance; }
  .note p .w { display: inline-block; opacity: 0; transform: translateY(10px) rotate(4deg); animation: wIn .5s cubic-bezier(.2, 1.4, .4, 1) forwards; animation-delay: calc(.45s + var(--i) * 45ms); }
  @keyframes wIn { to { opacity: 1; transform: none; } }
  .note .bigh { position: absolute; left: 50%; top: 50%; font-size: 120px; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }
  .note .bigh.go { animation: bigh .9s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes bigh { 30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(.95); opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1.2); opacity: 0; } }
  .acts { display: flex; gap: 10px; width: min(380px, 100%); }
  .act { flex: 1; height: 56px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255, 214, 230, .12); color: var(--blush); border: 1px solid rgba(255, 214, 230, .2); font-weight: 800; font-size: 16px; transition: transform .15s, background .25s, color .25s; }
  .act:active { transform: scale(.94); }
  .act.fav.on { background: var(--pink); color: var(--wine); border-color: var(--pink); }
  .act.main { background: var(--lime); color: var(--green); border-color: var(--lime); }
  .close { position: absolute; top: calc(16px + var(--safe-t)); right: 16px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 214, 230, .12); color: var(--blush); font-size: 18px; font-weight: 800; }
  .m-hint { font-size: 12.5px; font-weight: 700; color: rgba(255, 214, 230, .6); text-align: center; }

const glass = $('glass'), jar = $('jar');
function fillJar() {
  glass.innerHTML = '';
  const left = NOTAS.map((_, i) => i).filter(i => !isOpen.has(i));
  const n = left.length ? Math.max(1, Math.round(left.length / NOTAS.length * 40)) : 0;
  const rnd = (k, m) => ((k * 9301 + m * 49297) % 233280) / 233280;
  for (let k = 0; k < n; k++) {
    const row = Math.floor(k / 4), col = k % 4, kind = rnd(k, 4);
    const s = document.createElement('i');
    const paper = CATS[NOTAS[left[(k * 7) % left.length]].c].paper;
    if (kind > .9) { s.className = 'slip heart'; s.textContent = '♥'; s.style.color = rand(['#EE6FA5', '#C2306B', '#A6CC45']); }
    else { s.className = 'slip' + (kind > .62 ? ' roll' : ''); s.style.background = paper; s.style.width = (34 + rnd(k, 5) * 12) + 'px'; }
    s.style.left = (6 + col * 47 + (row % 2 ? 14 : 0) + rnd(k, 1) * 10) + 'px';
    s.style.bottom = (6 + row * 18 + rnd(k, 2) * 7) + 'px';
    s.style.transform = `rotate(${rnd(k, 3) * 90 - 45}deg)`;
    glass.appendChild(s);
  }
  $('left').innerHTML = left.length ? `quedan <b>${left.length}</b> notitas dentro` : 'ya las has sacado todas 🥹';
  $('badge').textContent = opened.length || '';
  $('bCount').textContent = `${opened.length} de ${NOTAS.length}`;
}

  hop();
  if (n === NOTAS.length && !saidHito.has(n)) {
    saidHito.add(n); store.set('hitos', [...saidHito]);
    rain(70); buzz([30, 60, 30, 60, 60]);
    say('Ufff ya las has sacado todas 🥹 te quiere muchísimo eh', 5000); return;
  }
  if (HITOS[n] && !saidHito.has(n)) {
    saidHito.add(n); store.set('hitos', [...saidHito]);
    if (n >= 10) rain(n >= 100 ? 50 : 26);
    say(HITOS[n], 3600); return;
  }
  if (Math.random() < .6) say(rand(BUNNY_LINES), 2400);
}

/* ---------- el conejito se duerme si no le haces caso ---------- */
let lastAct = Date.now();
document.addEventListener('pointerdown', () => {
  lastAct = Date.now();
  if (bunny.classList.contains('sleep')) { bunny.classList.remove('sleep'); hop(); say('Uy, me había quedado frito 😳', 2400); }
}, true);
setInterval(() => {
  const onJar = !$('jarScreen').classList.contains('off');
  if (onJar && bunny.classList.contains('corner') && !modal.classList.contains('on') && !document.body.classList.contains('event') && !hugging && Date.now() - lastAct > 40000) bunny.classList.add('sleep');
  // corazoncitos que salen del bote de vez en cuando
  if (onJar && !modal.classList.contains('on') && document.visibilityState === 'visible' && opened.length < NOTAS.length && $('app').classList.contains('on')) {
    const r = jar.getBoundingClientRect(), h = document.createElement('span');
    h.className = 'rise'; h.textContent = rand(['♥', '✦', '♥', '✿']);
    h.style.cssText = `left:${r.left + r.width / 2 + (Math.random() - .5) * 60}px;top:${r.top + 40}px;--x:${(Math.random() - .5) * 60}px;--r:${(Math.random() - .5) * 60}deg;color:${rand(['#F7A9C9', '#D9EBA8', '#EE6FA5'])}`;
    document.body.appendChild(h); setTimeout(() => h.remove(), 3300);
  }
}, 2600);

/* ---------- tablero ---------- */
let bFilter = 'all';
function renderBoard() {
  const board = $('board');
  const prev = new Set([...board.querySelectorAll('.pin')].map(p => +p.dataset.id));
  board.innerHTML = '';
  if (store.get('pinky', '') === 'done' && bFilter === 'all') {
    const L = document.createElement('button');
    L.className = 'pin letter'; L.style.setProperty('--pc', '#E2457F'); L.style.setProperty('--rot', '-1deg');
    L.innerHTML = `<p>💌 la notita que te trajo la conejita</p><span class="pd">${fdate(LETTER_DATE)} · tócala para releerla</span>`;
    L.onclick = () => { buzz(6); openLetter(false); };
    board.appendChild(L);
  }
  const list = [...opened].reverse().filter(i => bFilter === 'all' || favs.has(i));
  if (!list.length) {
    if (board.children.length) return;
    board.innerHTML = bFilter === 'fav'
      ? '<div class="empty"><div>💗</div>Aún no has guardado ninguna.<br>Dale dos toques a la que te guste 🥰</div>'
      : '<div class="empty"><div>🫙</div>Aquí se van quedando las que vayas sacando del bote ☺️</div>';
    return;
  }
  list.forEach(i => {
    const c = CATS[NOTAS[i].c], b = document.createElement('button');
    b.className = 'pin' + (prev.size && !prev.has(i) ? ' new' : '');
    b.dataset.id = i;
    b.style.setProperty('--paper', c.paper); b.style.setProperty('--pc', c.pin);
    b.style.setProperty('--rot', (((i * 37) % 9) - 4) / 2.2 + 'deg');
    const p = document.createElement('p'); p.textContent = NOTAS[i].t; b.appendChild(p);
    const dd = document.createElement('span'); dd.className = 'pd'; dd.textContent = fdate(NOTAS[i].d); b.appendChild(dd);
    if (favs.has(i)) { const h = document.createElement('span'); h.className = 'f'; h.textContent = '💗'; b.appendChild(h); }
    b.onclick = () => { buzz(6); openNote(i, { fresh: false, list }); };
    board.appendChild(b);
  });
}
$('seg').querySelectorAll('button').forEach(b => b.onclick = () => {
  bFilter = b.dataset.f; buzz(6);
  $('seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderBoard();
});

/* ---------- navegación ---------- */
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
  buzz(6);
  document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('off', s.id !== b.dataset.s));
  bunny.classList.toggle('hidden', b.dataset.s !== 'jarScreen');
  pinky.classList.toggle('hidden', b.dataset.s !== 'jarScreen');
  document.body.classList.toggle('on-board', b.dataset.s !== 'jarScreen');
  updateCare();
});


/* =========================================================
   LA CONEJITA ROSA: llega con lluvia, trae la notita de Adrián,
   sale el arcoíris y luego se queda (zanahorias y abrazos)
   ========================================================= */
const LETTER_DATE = '2026-11-11';
const LETTER = [
  'hola mi chulita, acabo de hablar contigo y te he notado un poquito desganada y desanimada... por eso he mandado a esta cosita con un mensaje para ti...',
  'en los días buenos reiremos hasta emborracharnos, pasearemos por donde siempre o por lugares que aún ni conocemos, comeremos ramen del bueno, turrón de churro, naranja o el que nos apetezca después de mirar todos y cada uno de los que haya en cualquier super... hemos tenido y sobre todo tendremos muchos de esos.',
  'pero en días un poco más raros, más grises o más desganados, yo estoy para ti como estoy siempre, y aunque ahora me sea imposible darte un abrazo fuerte y decirte al oído lo increíble que eres te mando esta notita para decirte que estoy en todo momento para ti michulita chocolatera, que pienso todo el rato en ti y en como estás, y para recordarte que te voy a cuidar de todas las formas que pueda y de la mejor forma que se...',
  ['sign', 'te quiero Olga, hoy y siempre'],
  ['pd', 'PD: por favor cuidame bien a los conejitos, que me están ayudando mucho'],
];
const pinky = $('pinky'), pBubble = $('pBubble'), care = $('care'), evBtn = $('evBtn');
let carrots = store.get('carrots', 0), hugs = store.get('hugs', 0), eating = false, hugging = false;

function sayP(html, ms = 2600) {
  pBubble.innerHTML = html; pBubble.classList.remove('on'); void pBubble.offsetWidth; pBubble.classList.add('on');
  clearTimeout(sayP.h); if (ms) sayP.h = setTimeout(() => pBubble.classList.remove('on'), ms);
}
function hopP() {
  pinky.classList.remove('hop'); void pinky.offsetWidth; pinky.classList.add('hop', 'happy');
  clearTimeout(hopP.h); hopP.h = setTimeout(() => { if (!hugging) pinky.classList.remove('happy'); }, 900);
}
function setFat() {
  pinky.style.setProperty('--fat', (1 + Math.min(carrots, 30) * .017).toFixed(4));
  $('carrotN').textContent = carrots || '';
}
function updateCare() {
  const onJar = !$('jarScreen').classList.contains('off');
  const ok = store.get('pinky', '') === 'done' && onJar && !document.body.classList.contains('event') && !hugging;
  care.classList.toggle('on', ok);
}
function ask(label) {
  return new Promise(res => {
    evBtn.textContent = label; evBtn.classList.add('on');
    evBtn.onclick = () => { evBtn.onclick = null; evBtn.classList.remove('on'); buzz(8); res(); };
  });
}

/* --- lluvia y arcoíris --- */
function startRain() {
  const r = $('rain'); r.innerHTML = '';
  [[ -40, -60, 260, 170 ], [ 160, -80, 300, 180 ], [ -20, 40, 200, 120 ]].forEach(([x, y, w, h], i) => {
    const c = document.createElement('i'); c.className = 'cloud';
    c.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;animation-delay:${-i * 2}s`; r.appendChild(c);
  });
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('i'); d.className = 'drop';
    d.style.cssText = `left:${Math.random() * 108}%;height:${14 + Math.random() * 16}px;opacity:${.35 + Math.random() * .6};animation-duration:${.55 + Math.random() * .5}s;animation-delay:${-Math.random() * 1.2}s`;
    r.appendChild(d);
  }
  for (let i = 0; i < 16; i++) {
    const rp = document.createElement('i'); rp.className = 'ripple';
    rp.style.cssText = `left:${Math.random() * 100}%;top:${72 + Math.random() * 26}%;animation-delay:${-Math.random() * 1.4}s;animation-duration:${1.1 + Math.random() * .6}s`;
    r.appendChild(rp);
  }
  r.classList.add('on'); document.body.classList.add('gloom');
}
function stopRain() {
  $('rain').classList.remove('on'); document.body.classList.remove('gloom');
  setTimeout(() => { if (!$('rain').classList.contains('on')) $('rain').innerHTML = ''; }, 1600);
}

/* --- la escena --- */
async function rainyVisit() {
  document.body.classList.add('event'); updateCare();
  if (modal.classList.contains('on')) { popLayer('note'); modal.classList.remove('on'); }
  document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('on', x.dataset.s === 'jarScreen'));
  document.querySelectorAll('.screen').forEach(sc => sc.classList.toggle('off', sc.id !== 'jarScreen'));
  bunny.classList.remove('hidden', 'sleep');
  startRain(); buzz(20);
  await sleep(1100);
  say('Uy… está lloviendo 🥺', 2600);
  await sleep(2700);
  pinky.className = 'bunny pinky show stage enter umb';
  await sleep(2150);
  pinky.classList.remove('enter'); hopP();
  say('¡anda! 😳', 1800);
  await sleep(900);
  sayP('Hola Olga ☺️', 0);
  await ask('hola… 🥺');
  hopP();
  sayP('Vengo de parte de <em>Adrián</em>, que me ha mandado con una cosita para ti 🥹', 0);
  await ask('¿para mí? 🥹');
  pBubble.classList.remove('on');
  // le da el sobre
  pinky.classList.add('give');
  await sleep(450);
  const held = pinky.querySelector('.held').getBoundingClientRect();
  pinky.classList.add('gave');
  const env = $('env'); env.classList.remove('open', 'crack', 'flapback', 'rise', 'drop', 'idle'); env.classList.add('on');
  const er = env.getBoundingClientRect();
  const dx = held.left + held.width / 2 - (er.left + er.width / 2), dy = held.top + held.height / 2 - (er.top + er.height / 2);
  await env.animate([
    { transform: `translate(${dx}px, ${dy}px) scale(${held.width / er.width})` },
    { transform: `translate(${dx * .4}px, ${dy * .4 - 70}px) scale(.8) rotate(-8deg)`, offset: .55 },
    { transform: 'none' },
  ], { duration: 950, easing: 'cubic-bezier(.3, 1.2, .4, 1)' }).finished;
  env.classList.add('idle');
  // deja de llover, sale el arcoíris
  stopRain();
  pinky.classList.remove('umb'); pinky.classList.add('shake');
  { const q = pinky.getBoundingClientRect(); sparks(q.left + q.width / 2, q.top + q.height * .3, 10, 70, ['💧', '✦', '💧']); }
  setTimeout(() => pinky.classList.remove('shake'), 700);
  await sleep(700);
  document.body.classList.remove('calm', 'static'); document.body.classList.add('rainbow');
  buzz([20, 50, 20]);
  sparks(innerWidth / 2, innerHeight * .2, 18, 160, ['✦', '✧', '♥', '✿']);
  pinky.classList.remove('stage', 'give'); pinky.classList.add('corner');
  await sleep(1000);
  say('Mira, ¡un arcoíris! 🥹', 2600);
  await new Promise(res => env.onclick = () => { env.onclick = null; res(); });
  env.classList.remove('idle');
  const r2 = env.getBoundingClientRect();
  env.classList.add('crack'); buzz([8, 30, 8]);
  sparks(r2.left + r2.width / 2, r2.top + r2.height * .6, 10, 60, ['✦', '♥', '✧']);
  await sleep(420);
  env.classList.add('open'); buzz(12);
  await sleep(380); env.classList.add('flapback');
  await sleep(300); env.classList.add('rise');
  sparks(r2.left + r2.width / 2, r2.top - 10, 14, 120);
  await sleep(850);
  const paperRect = env.querySelector('.ep').getBoundingClientRect();
  env.classList.add('drop');
  openLetter(true, paperRect);
  setTimeout(() => env.classList.remove('on', 'crack', 'open', 'flapback', 'rise', 'drop'), 700);
}

/* --- la carta --- */
let letterFirst = false, revealT = [], userScrolled = false;
function openLetter(first, fromRect) {
  letterFirst = first;
  revealT.forEach(clearTimeout); revealT = [];
  const card = $('ltCard'), body = $('ltBody'), bun = card.querySelector('.bunnies');
  card.classList.remove('all');
  $('ltDate').textContent = fdate(LETTER_DATE);
  body.innerHTML = '';
  let t = fromRect ? 700 : 350; const paras = [];
  LETTER.forEach(x => {
    const p = document.createElement('p'); let txt = x;
    if (Array.isArray(x)) { p.className = x[0]; txt = x[1]; }
    if (first) {
      paras.push([p, t]);
      txt.split(' ').forEach(w => { const sp = document.createElement('span'); sp.className = 'lw'; sp.style.setProperty('--d', t + 'ms'); sp.textContent = w; p.append(sp, ' '); t += 30; });
      t += 450;
    } else p.textContent = txt;
    body.appendChild(p);
    p.classList.add('in');
  });
  bun.classList.remove('in'); $('ltClose').classList.remove('in');
  card.scrollTop = 0; userScrolled = false;
  $('lt').classList.add('on'); pushLayer('letter');
  if (first) {
    $('ltSkip').classList.add('in');
    if (fromRect) {
      card.classList.add('flip');
      const cr = card.getBoundingClientRect();
      const dx = fromRect.left + fromRect.width / 2 - (cr.left + cr.width / 2), dy = fromRect.top + fromRect.height / 2 - (cr.top + cr.height / 2);
      card.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${fromRect.width / cr.width}, ${fromRect.height / cr.height})`, opacity: .9 }, { transform: 'none', opacity: 1 }],
        { duration: 760, easing: 'cubic-bezier(.2, 1, .3, 1)' }).finished.then(() => card.classList.remove('flip')).catch(() => {});
    }
    paras.forEach(([p, pt]) => revealT.push(setTimeout(() => {
      if (!userScrolled && !card.classList.contains('all')) card.scrollTo({ top: Math.max(0, p.offsetTop - 70), behavior: 'smooth' });
    }, pt)));
    revealT.push(setTimeout(finishLetter, t));
  } else {
    $('ltSkip').classList.remove('in'); bun.classList.add('in'); $('ltClose').classList.add('in');
  }
}
function finishLetter() {
  revealT.forEach(clearTimeout); revealT = [];
  const card = $('ltCard'); card.classList.add('all');
  card.querySelector('.bunnies').classList.add('in');
  $('ltClose').classList.add('in'); $('ltSkip').classList.remove('in');
}
['touchstart', 'wheel'].forEach(ev => $('ltCard').addEventListener(ev, () => { userScrolled = true; }, { passive: true }));
$('ltCard').addEventListener('click', () => { if (!$('ltCard').classList.contains('all') && $('ltSkip').classList.contains('in')) finishLetter(); });
function closeLetter(fromPop) {
  if (!$('lt').classList.contains('on')) return;
  if (fromPop !== true) popLayer('letter');
  revealT.forEach(clearTimeout); revealT = [];
  $('lt').classList.remove('on');
  if (letterFirst) { letterFirst = false; afterLetter(); }
}
$('ltClose').onclick = () => { buzz(8); closeLetter(); };

function afterLetter() {
  store.set('pinky', 'done');
  document.body.classList.remove('event');
  document.body.classList.add('has-pinky', 'calm');
  pinky.classList.add('show', 'corner', 'gave');
  renderBoard(); updateCare();
  setTimeout(() => { hop(); say('Ya no llueve eh ☺️', 2600); }, 400);
  setTimeout(() => { hopP(); sayP('Yo me quedo por aquí, que me lo ha pedido él 🥰<br>¿me das una zanahoria? 🥺', 4500); }, 2400);
}

/* --- zanahorias: la conejita se va poniendo gordita --- */
const CARROT_HITOS = { 1: 'Ñam ñam 🥕☺️ gracias Olga', 5: 'Ufff ya llevo 5 eh 🤤', 10: 'Me estoy poniendo gordita 😳', 20: 'Pfff ya casi no quepo 🫠', 30: 'No puedo más 🥺… bueno, una más vale' };
const CARROT_LINES = ['Ñam ñam 🥕', 'Ufff qué rica 🤤', 'Gracias Olga 🥹', 'Otra porfa 🥺', 'Jeje 🥰', 'Qué bien me cuidas eh ☺️'];
$('carrotBtn').onclick = async () => {
  if (eating || hugging) return;
  eating = true; buzz(8);
  const b = $('carrotBtn').getBoundingClientRect(), p = pinky.getBoundingClientRect();
  const sx = b.left + b.width / 2, sy = b.top + b.height / 2;
  const tx = p.left + p.width * .5 - sx, ty = p.top + p.height * .52 - sy;
  const c = document.createElement('span'); c.className = 'carrot-fly'; c.textContent = '🥕';
  c.style.left = sx + 'px'; c.style.top = sy + 'px'; document.body.appendChild(c);
  await c.animate([
    { transform: 'translate(0, 0) scale(.7) rotate(0)' },
    { transform: `translate(${tx * .5}px, ${ty - 80}px) scale(1.25) rotate(-160deg)`, offset: .5 },
    { transform: `translate(${tx}px, ${ty}px) scale(.7) rotate(-300deg)` },
  ], { duration: 620, easing: 'cubic-bezier(.3, .1, .3, 1)', fill: 'forwards' }).finished;
  pinky.classList.remove('chomp'); void pinky.offsetWidth; pinky.classList.add('chomp', 'happy');
  for (const cut of [34, 67, 100]) { c.style.clipPath = `inset(0 0 0 ${cut}%)`; sparks(sx + tx, sy + ty + 8, 3, 24, ['·', '•', '✦']); buzz(10); await sleep(170); }
  c.remove();
  carrots++; store.set('carrots', carrots); setFat();
  pinky.classList.remove('chomp'); void pinky.offsetWidth; pinky.classList.add('chomp', 'happy');
  sparks(p.left + p.width * .5, p.top + p.height * .5, 6, 45, ['ñam', '✦', '♥']);
  sayP(CARROT_HITOS[carrots] || (carrots > 30 ? rand(['Estoy redondita ya 😳', 'Ñam… 🫠', 'Una más y ruedo 🥺']) : rand(CARROT_LINES)), 2200);
  setTimeout(() => { eating = false; }, 380);
  clearTimeout(window._chomp); window._chomp = setTimeout(() => pinky.classList.remove('chomp', 'happy'), 950);
};

/* --- abrazo de los dos conejitos --- */
const HUG_W = ['Ufff qué abrazo más bueno 🥹', 'Esto es lo que necesitaba 🫠', 'Abrazo de parte de Adri eh ☺️', 'Otro cuando quieras 🥰'];
const HUG_P = ['Jo qué gustito 🥺', 'Este va de su parte 🤗', 'Te queremos mucho eh ☺️', 'Ya está, ya está 🥹'];
$('hugBtn').onclick = async () => {
  if (hugging || eating) return;
  hugging = true; buzz(10);
  bunny.classList.remove('sleep'); bubble.classList.remove('on'); pBubble.classList.remove('on');
  updateCare();
  const cx = innerWidth / 2, wr = bunny.getBoundingClientRect(), pr = pinky.getBoundingClientRect();
  bunny.classList.add('travel'); pinky.classList.add('travel');
  bunny.style.transform = `translateX(${cx - wr.width + 16 - wr.left}px)`;
  pinky.style.transform = `translateX(${cx - 16 - pr.left}px)`;
  await sleep(950);
  bunny.classList.remove('travel'); pinky.classList.remove('travel');
  bunny.classList.add('hug', 'happy'); pinky.classList.add('hug', 'happy');
  const h = $('hugHeart'); h.style.left = cx + 'px'; h.style.top = (wr.top + 6) + 'px'; h.classList.add('on');
  for (let i = 0; i < 4; i++) {
    buzz([45, 120, 45]);
    sparks(cx, wr.top + wr.height * .45, 7, 75, ['💗', '💕', '♥', '✦']);
    await sleep(900);
  }
  sparks(cx, wr.top + wr.height * .4, 18, 140, ['💗', '💖', '✨', '♥']);
  h.classList.remove('on');
  bunny.classList.remove('hug', 'happy'); pinky.classList.remove('hug', 'happy');
  hugs++; store.set('hugs', hugs);
  bunny.classList.add('travel'); pinky.classList.add('travel');
  bunny.style.transform = ''; pinky.style.transform = '';
  await sleep(950);
  bunny.classList.remove('travel'); pinky.classList.remove('travel');
  hugging = false; updateCare();
  say(rand(HUG_W), 2600);
  setTimeout(() => sayP(rand(HUG_P), 2600), 1100);
};

/* --- tocar a la conejita --- */
const PINKY_PET = ['Jeje hola ☺️', '¿me das una zanahoria? 🥺', 'Te quiere mucho eh', 'Ufff qué bien se está aquí 🫠', 'Cuídame bien eh, que me lo ha dicho él 🥹', '¿Un abrazo? 🤗'];
pinky.addEventListener('click', () => {
  if (!pinky.classList.contains('corner') || document.body.classList.contains('event') || hugging) return;
  hopP(); buzz(10);
  const r = pinky.getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + 30, 8, 60, ['💗', '💕', '✨']);
  sayP(carrots >= 10 && Math.random() < .3 ? 'Estoy gordita por tu culpa 😳' : rand(PINKY_PET), 2400);
});

function initPinky() {
  document.body.classList.add('has-pinky', 'rainbow', 'calm', 'static');
  pinky.className = 'bunny pinky show corner gave';
  setFat();
}
setFat();

/* ---------- arranque ---------- */
fillJar(); renderBoard();
if (store.get('tapped', 0)) { $('finger').style.opacity = '0'; $('tapHint').style.opacity = '0'; }
const pinkyDone = store.get('pinky', '') === 'done';
if (pinkyDone) initPinky();
if (store.get('delivered', 0)) { intro.classList.add('off'); bunny.classList.add('give'); deliver(false).then(() => { if (!pinkyDone) setTimeout(rainyVisit, 1300); updateCare(); }); }
else runIntro().then(() => { if (!pinkyDone) setTimeout(rainyVisit, 3200); });
