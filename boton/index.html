<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Para ti, michulita</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF7F8;
    --bg-deep: #FCE4EA;
    --accent: #E8788C;
    --accent-dark: #D45A70;
    --accent-light: #F4B8C4;
    --text: #4A2832;
    --text-soft: #7A5060;
    --text-light: #B08898;
    --card: rgba(255,255,255,0.75);
    --shadow: rgba(180,100,120,0.22);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { height:100%; }
  body {
    font-family:'Quicksand', sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 0%, #fff 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(241,200,212,.55), transparent 50%),
      linear-gradient(165deg, var(--bg) 0%, #fff0f3 45%, var(--bg-deep) 100%);
    overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  }

  header { text-align:center; margin-bottom:28px; z-index:2; }
  header h1 { font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500; font-size:clamp(30px, 8vw, 44px); color:var(--accent-dark); }
  header p { margin-top:6px; color:var(--text-light); font-size:15px; }

  .card {
    position:relative; z-index:2;
    width:min(420px, 100%); min-height:170px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:28px 26px; border-radius:26px;
    background:var(--card); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 14px 40px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.8);
  }
  .msg {
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:clamp(23px, 6.2vw, 30px); line-height:1.3; color:var(--text);
  }
  .msg.hint { font-family:'Quicksand', sans-serif; font-size:17px; color:var(--text-soft); font-weight:500; }
  .msg.show { animation:pop .55s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { opacity:0; transform:translateY(12px) scale(.94); filter:blur(4px);} to { opacity:1; transform:none; filter:none; } }

  .btn-wrap { position:relative; margin-top:40px; z-index:3; }
  .heart-btn {
    position:relative; width:150px; height:150px; border:none; background:none; cursor:pointer; font-family:inherit;
    animation:beat 1.6s ease-in-out infinite; outline:none;
  }
  .heart-btn svg { width:100%; height:100%; filter:drop-shadow(0 12px 22px rgba(212,90,112,.42)); transition:transform .15s; }
  .heart-btn:active svg { transform:scale(.88); }
  .heart-btn span {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:10px;
    color:#fff; font-weight:700; font-size:17px; letter-spacing:.3px; text-shadow:0 1px 3px rgba(120,30,50,.35);
  }
  .heart-btn:focus-visible svg { filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--accent-dark)); }
  @keyframes beat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.08)} 28%{transform:scale(1)} 42%{transform:scale(1.06)} 56%{transform:scale(1)} }

  .firma { margin-top:10px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:19px; color:var(--accent); z-index:2; }
  .counter { margin-top:22px; color:var(--text-light); font-size:14px; min-height:20px; z-index:2; text-align:center; }

  /* floating background hearts */
  .bg-heart { position:fixed; bottom:-40px; z-index:0; pointer-events:none; color:var(--accent-light); opacity:.55; animation:rise linear forwards; }
  @keyframes rise { to { transform:translateY(-115vh) rotate(var(--r)); opacity:0; } }

  /* burst particles */
  .particle { position:fixed; z-index:5; pointer-events:none; font-size:22px; animation:fly .95s cubic-bezier(.15,.7,.35,1) forwards; }
  @keyframes fly { from { transform:translate(-50%,-50%) scale(.4); opacity:1; } to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--r)); opacity:0; } }

  .special { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:24px;
    background:rgba(255,240,243,.86); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); text-align:center; }
  .special.on { display:flex; animation:pop .6s both; }
  .special h2 { font-family:'Cormorant Garamond', serif; font-style:italic; font-size:clamp(32px,9vw,48px); color:var(--accent-dark); line-height:1.15; }
  .special p { margin-top:14px; color:var(--text-soft); font-size:16px; }
  .special button { margin-top:26px; border:none; background:var(--accent); color:#fff; font:600 16px 'Quicksand',sans-serif; padding:12px 26px; border-radius:999px; box-shadow:0 8px 20px var(--shadow); cursor:pointer; }

  @media (prefers-reduced-motion: reduce) { .heart-btn { animation:none; } .bg-heart { display:none; } }
</style>
</head>
<body>

<header>
  <h1>Para ti, michulita</h1>
  <p>pulsa el corazón cuando lo necesites</p>
</header>

<div class="card"><div class="msg hint" id="msg">Aquí dentro hay muchas cosas que pienso de ti 💌</div></div>

<div class="btn-wrap">
  <button class="heart-btn" id="btn" aria-label="Dime algo bonito">
    <svg viewBox="0 0 100 92" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F49AAB"/><stop offset="1" stop-color="#D45A70"/></linearGradient></defs>
      <path fill="url(#g)" d="M50 90 C 20 68 2 50 2 28 C 2 13 13 2 27 2 C 37 2 45 8 50 16 C 55 8 63 2 73 2 C 87 2 98 13 98 28 C 98 50 80 68 50 90 Z"/>
      <ellipse cx="28" cy="22" rx="11" ry="7" fill="#fff" opacity=".28" transform="rotate(-25 28 22)"/>
    </svg>
    <span>Pulsa</span>
  </button>
</div>

<div class="counter" id="counter"></div>
<div class="firma">— Adrián 💗</div>

<div class="special" id="special">
  <div>
    <h2>Ya los has leído todos 🥹</h2>
    <p>Pero que sepas que me quedan muchísimos más<br>que decirte en persona.</p>
    <button id="again">Volver a empezar</button>
  </div>
</div>

<script>
  // ✏️ Edita aquí los mensajes (uno por línea, entre comillas y con coma al final)
  const MENSAJES = [
    "Eres increíble y la mejor novia del mundo.",
    "Para mí eres lo más espectacular que he visto, en casi todos los sentidos.",
    "Eres una belleza que yo no he visto nada igual en mi vida.",
    "Lo preciosa que eres por fuera y lo especial que eres por dentro.",
    "Eres muy inteligente, sensible y empática.",
    "Eres igual de guapa que de inteligente.",
    "Te he visto despeinada, sobada, en pijama… y no ha habido segundo que no haya pensado que eres lo más bonito que hay.",
    "Y la cara, yo no sé qué pasa, que cada día eres más bonita.",
    "Más guapa que la más guapa, y la más guapa eres tú.",
    "Da exactamente igual lo que hagas o lo que te pase: más bonita no puedes estar.",
    "Te vas igual de bonita que siempre, porque no sabes ser de otra forma.",
    "Si eres preciosa, se te tiene que decir todas las veces que haga falta y punto.",
    "Mira que eres mona y preciosa, incluso llorando.",
    "Tú sí que eres bonita, mi dorito fibrado mojado en salsa de belleza.",
    "Rencorosa, preciosa, orgullosa, talentosa, misteriosa, poderosa… olgaseosa.",
    "Tú ya eres gigante y vas a seguir creciendo sin parar, michula.",
    "Sé lo mucho que eres, lo mucho que sientes y lo muchísimo que vales. Lo acepto todo y lo adoro todo.",
    "Vales muchísimo y lo tengo muy claro.",
    "Eres lo mejor que hay en esta vida estresada.",
    "Tú sí que eres lo mejor que hay en el mundo entero, mi bonita suave.",
    "Así te quiero ver siempre: bien feliz y mirándome con esos ojos largos como el Nilo.",
    "No seas tan dura contigo misma: que tengas una mala época no significa que dejes de ser un 10.",
    "En los días que te sientas mejor, yo lo celebro contigo. Y en los días que te sientas un poco peor, yo te recuerdo todo lo bueno, que créeme que es muchísimo.",
    "Ya te digo yo si puedes con todo.",
    "No te dejes pisotear, Olga. No podrán contigo.",
    "Estate tranquila, que seguro que te sale como siempre.",
    "Solo tienes que ser tú: eres atenta y cuidona, eres detallista, lo ves todo y lo tienes todo en cuenta.",
    "Yo te veo bonita siempre, y créeme que te veo de verdad: con todo lo que eres, todo lo bueno que eres, que tienes y que haces.",
    "Van a flipar contigo, lo tengo clarísimo.",
    "Eres muy autoexigente contigo misma, y eso te hace ser mejor en todos los sentidos.",
    "Te lo has currado, porque vales mucho.",
    "Te adoro, michulita. Todo está bien y a mejor, como siempre.",
    "Nos espera una vida maravillosa.",
    "Contigo al lado no le tengo miedo a nada.",
    "Aquí estoy siempre.",
    "Yo te voy a dar mi calor, mi mano y mi todo siempre, michulita. En todos los momentos voy a estar para ti.",
    "Estoy para ti y tienes todo mi apoyo, energía y ganas para que puedas estar lo mejor posible.",
    "Aunque esté a lo mío y con los míos, siempre estoy para ti.",
    "Sabes que me puedes contar lo que sea y desahogarte si lo necesitas.",
    "Para ti saco tiempo y energía de donde sea.",
    "Los abrazos fuertes te los voy a dar, ahora y siempre.",
    "Por muy liado que vaya, siempre estoy pendiente de ti.",
    "Estoy para ti siempre, Olga. Ahora más que nunca.",
    "Sé que nos tenemos el uno al otro y que siempre queremos lo mejor. Somos así, y juntos aún más.",
    "Eres el amor de mi vida, la mujer de mis sueños y mi compañera pa' todo y pa' siempre.",
    "Te amo todo lo que se puede amar a alguien.",
    "Claro que eres mi persona favorita.",
    "Para mí eres de lo mejor que tengo, de lo más importante y de lo que más quiero.",
    "Te quiero con todo lo que eres, cada uno de tus pensamientos.",
    "Te quiero así, tal cual. Sin nada más ni nada menos.",
    "No sabes lo afortunado y lo feliz que me siento por estar contigo.",
    "Me entiendes y me cuidas, me alegras la vida y me haces sentir muy afortunado.",
    "Contigo tengo la mejor rutina de todas, porque estar a tu lado es lo que mejor me sienta.",
    "Desde que estoy contigo estoy mucho mejor en todos los sentidos.",
    "Contigo me calmo y desconecto del ruido que tengo dentro y fuera.",
    "Yo me veo contigo para siempre.",
    "Yo quiero mi vida a tu lado: cuanto más tiempo y más cerca, mejor.",
    "Te quiero mucho, por si no te lo he dicho hoy.",
    "Te quiero pasiempre, desde las dos a la una.",
    "Da igual coja, manca o tuerta: yo me quedo contigo siempre.",
    "Para mí eres michulita y miamor, sobre todo.",
    "Eres la mejor, gracias por tanto.",
    "Cuánto te quiero, qué suerte tengo de tenerte cerca.",
    "Mientras sea a tu lado, yo soy lo más feliz que puedo ser.",
    "Qué ganas de todos los besos, de todas las risas y de todos los abrazos colgones.",
  ];

  const EMOJIS = ["💖","💗","💕","🌸","✨","💘","🥰","💞"];
  const msgEl = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const counter = document.getElementById("counter");
  const special = document.getElementById("special");

  let bolsa = [];
  let leidos = 0;
  const mezclar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rellenar = () => { bolsa = mezclar(MENSAJES.map((_, i) => i)); };
  rellenar();

  function burst(x, y) {
    const n = 14;
    for (let i = 0; i < n; i++) {
      const p = document.createElement("span");
      p.className = "particle";
      p.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      const ang = (Math.PI * 2 * i) / n + Math.random() * .4;
      const dist = 90 + Math.random() * 90;
      p.style.left = x + "px"; p.style.top = y + "px";
      p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      p.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      p.style.setProperty("--r", (Math.random() * 80 - 40) + "deg");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  btn.addEventListener("click", e => {
    const r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    if (navigator.vibrate) navigator.vibrate(25);

    const i = bolsa.pop();
    leidos++;
    msgEl.classList.remove("show", "hint");
    void msgEl.offsetWidth;
    msgEl.textContent = MENSAJES[i];
    msgEl.classList.add("show");
    counter.textContent = `${leidos} de ${MENSAJES.length} 💗`;

    if (bolsa.length === 0) setTimeout(() => special.classList.add("on"), 1800);
  });

  document.getElementById("again").addEventListener("click", () => {
    special.classList.remove("on");
    leidos = 0; rellenar();
    counter.textContent = "";
    msgEl.className = "msg hint"; msgEl.textContent = "Otra vuelta, que nunca sobran 💌";
  });

  // corazoncitos flotando de fondo
  setInterval(() => {
    const h = document.createElement("span");
    h.className = "bg-heart"; h.textContent = "♥";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 12 + Math.random() * 18 + "px";
    h.style.animationDuration = 8 + Math.random() * 6 + "s";
    h.style.setProperty("--r", (Math.random() * 60 - 30) + "deg");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 15000);
  }, 900);
</script>
</body>
</html>
